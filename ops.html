<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Chazki Driver · Panel de Operaciones</title>
<style>
:root{--bg:#f3f5f9;--ink:#182230;--mut:#718096;--line:#e5eaf1;--pri:#4b2fd0;--pri2:#674ee8;--ok:#12845b;--bad:#d9434b;--nav:#111827;--navmut:#a7b0c0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;height:72px;background:#fff;color:var(--ink);padding:0 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
header .brand{display:flex;align-items:center;gap:14px;min-width:300px}
header .brandmark{display:block;width:150px;height:auto;max-height:42px;object-fit:contain}
header h1{margin:0;font-size:16px;letter-spacing:-.02em}header .subtitle{display:block;color:var(--mut);font-size:11px;margin-top:3px}
header .welcome-title{margin:0}
header .head-actions{display:flex;align-items:center;gap:10px}
header .role{font-size:12px;color:#5541bd;background:#f1efff;padding:7px 11px;border-radius:99px;font-weight:700}
header button{color:#445064;background:#f3f5f9;border:1px solid var(--line);padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
header #bell{font-size:16px;padding:7px 11px;position:relative}
#bellc{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;text-align:center}
.workspace{display:grid;grid-template-columns:244px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:72px;align-self:start;background:var(--nav);padding:22px 13px;color:#fff;min-height:calc(100vh - 72px);height:calc(100vh - 72px);overflow-y:auto}
.nav-caption{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#7f8ba0;padding:16px 12px 7px}
.role-nav{display:flex;flex-direction:column;gap:4px;margin:0}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-sub{display:none;flex-direction:column;gap:4px;padding-left:16px;grid-column:1/-1}
.nav-sub.open{display:flex}
.role-nav button{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;color:var(--navmut);padding:10px 12px;border-radius:9px;font-size:13px;font-weight:550;cursor:pointer;transition:background .15s,color .15s}
.role-nav button:hover{background:#ffffff10;color:#fff}
.role-nav button.on{background:#4b2fd033;color:#fff;box-shadow:inset 3px 0 var(--pri2)}
.nav-icon{width:20px;text-align:center;font-size:15px;opacity:.9}
.content{min-width:0;padding:25px 28px 40px}
.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.page-heading h2{margin:0;font-size:22px;letter-spacing:-.03em}.page-heading p{margin:5px 0 0;color:var(--mut);font-size:13px}
.content .bar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 2px 6px #18223008}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,23,43,.06)}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:26px;margin-top:4px}
.doc-import{margin:0 0 20px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px #18223008}
.doc-import-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.doc-import-icon{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:13px;background:#f1efff;color:var(--pri);font-size:20px}
.doc-import-head h3{margin:1px 0 5px;font-size:17px;letter-spacing:-.02em}
.doc-import-head p{max-width:760px;margin:0;color:var(--mut);font-size:13px;line-height:1.55}
.doc-import-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.doc-import-field{display:flex;min-width:0;flex-direction:column;gap:6px;color:#465267;font-size:12px;font-weight:650}
.doc-import-field select,.doc-import-field input{width:100%;min-height:42px;padding:9px 11px;border:1px solid #dce2ec;border-radius:10px;background:#fff;color:var(--ink);font-size:14px;font-family:inherit;font-weight:500}
.doc-import-field input[type=file]{padding:7px;background:#f8f9fc;font-size:12px}
.doc-import-field select:focus,.doc-import-field input:focus{outline:2px solid #674ee833;border-color:var(--pri2)}
.doc-import-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}
.doc-import-footer .note{margin:0;max-width:650px;line-height:1.5}
.doc-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 4px 10px}
.doc-section-title h3{margin:0;font-size:17px}
.doc-count{padding:5px 10px;border-radius:99px;background:#f1efff;color:#5541bd;font-size:12px;font-weight:750}
.doc-table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #18223008}
.doc-table-wrap table{min-width:760px}
.doc-table-wrap td:first-child{font-weight:650}
.doc-error{padding:14px 16px;border:1px solid #f2c9a2;border-radius:12px;background:#fff8ef;color:#754616;font-size:13px;line-height:1.55}
.doc-error b{display:block;margin-bottom:3px}
.doc-error code{padding:2px 5px;border-radius:5px;background:#fff0dd;font-size:12px}
.exec-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0 18px}
.exec-stat{padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#fff,#fafaff)}
.exec-stat small{display:block;color:var(--mut);font-size:12px}
.exec-stat b{display:block;margin-top:5px;font-size:23px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.exec-stat span{display:block;margin-top:3px;color:var(--mut);font-size:11px}
.exec-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 20px}
.exec-chart{min-width:0;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 8px #18223008}
.exec-chart h4{margin:0;font-size:14px;letter-spacing:-.01em}
.exec-chart>p{margin:4px 0 14px;color:var(--mut);font-size:11px;line-height:1.45}
.exec-legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;color:var(--mut);font-size:11px}
.exec-legend span{display:inline-flex;align-items:center;gap:5px}
.exec-legend i{width:9px;height:9px;border-radius:3px;background:var(--chart-color);display:inline-block}
.exec-bars{display:grid;gap:11px}
.exec-bar-row{display:grid;grid-template-columns:minmax(72px,95px) minmax(0,1fr) 42px;align-items:center;gap:9px;font-size:11px}
.exec-period{display:grid;gap:6px;padding:8px 0;border-bottom:1px solid #eef1f6}
.exec-period:last-child{border-bottom:0}
.exec-period-title{color:#354155;font-size:11px;font-weight:700}
.exec-period .exec-bar-row{grid-template-columns:minmax(64px,78px) minmax(0,1fr) 48px;padding-left:9px}
.exec-bar-label{overflow:hidden;color:#526078;text-overflow:ellipsis;white-space:nowrap}
.exec-track{height:9px;overflow:hidden;border-radius:99px;background:#eef1f6}
.exec-fill{height:100%;min-width:2px;border-radius:inherit;background:var(--chart-color)}
.exec-bar-value{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.exec-stack{display:flex;height:16px;overflow:hidden;border-radius:99px;background:#eef1f6}
.exec-stack span{height:100%;min-width:0}
.exec-mix{display:grid;gap:10px;margin-top:14px}
.exec-mix-row{display:grid;grid-template-columns:minmax(85px,1fr) auto;gap:8px;align-items:center;font-size:12px}
.exec-mix-row b{font-variant-numeric:tabular-nums}
.exec-empty{padding:20px 10px;border:1px dashed #d7deea;border-radius:10px;color:var(--mut);font-size:12px;text-align:center}
.exec-table-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 8px}
.exec-table-title h3{margin:0;font-size:16px}
.exec-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.exec-table-wrap table{min-width:760px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:0 2px 8px #18223008;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
tr:last-child td{border:0}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.ok{background:#dcf5ea;color:#0b7a50}.w{background:#fdf0d4;color:#946200}.bad{background:#fde3e4;color:#b3262b}
img.th{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer}
#auth{width:calc(100% - 32px);max-width:420px;margin:12vh auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(20,23,43,.1)}
#auth .welcome-brand{text-align:center;margin-bottom:20px}
#auth .welcome-logo{display:block;width:min(270px,100%);height:auto;margin:0 auto 15px;object-fit:contain}
#auth .welcome-heading{margin:0 0 5px;font-size:25px;letter-spacing:-.03em}
#auth .welcome-country{color:var(--mut);font-size:13px;font-weight:600}
#auth input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;font-size:15px}
#auth button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.errbox{background:#fde3e4;color:#8f1d22;border-radius:10px;padding:9px;font-size:13px;margin-top:10px}
.hide{display:none!important}
#loading{position:fixed;inset:0;background:linear-gradient(145deg,#3923ad,#674ee8);z-index:60;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
#loading .welcome{display:flex;flex-direction:column;align-items:center;gap:12px}
#loading .logo{display:block;width:min(300px,82vw);height:auto;max-height:76px;object-fit:contain}
#loading .country{font-size:13px;font-weight:600;letter-spacing:.08em;color:#ffffffd9}
#loading h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 0}
#loading p{margin:0;color:#ffffffc9;font-size:14px}
#loading .spinner{width:24px;height:24px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:loading-spin .8s linear infinite;margin-top:8px}
@keyframes loading-spin{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:rgba(20,23,43,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#modal .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:660px}
#modal label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#modal input[type=number],#modal input[type=text],#modal select,#modal textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:#eceefb;color:var(--pri)}.btn:disabled{background:#c9cbdb;cursor:not-allowed}.sm{padding:6px 10px;font-size:12px;border-radius:8px}
td select{padding:6px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.res{width:100%}.res td{padding:5px 8px}.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}.res tr.t td{font-weight:700;border-top:2px solid var(--line)}.res tr.h td{color:var(--mut);font-size:11px;text-transform:uppercase;border:0;padding-top:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14172b;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;z-index:40;opacity:0;transition:.25s;pointer-events:none;max-width:90%}#toast.show{opacity:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9}#lb img{max-width:92vw;max-height:92vh;border-radius:10px}
.pnr-layout{display:grid;gap:18px;padding:12px 4px 8px}
.pnr-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 3px 12px #18223008}
.pnr-form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.pnr-form-head h3,.pnr-list-head h3{margin:0;font-size:18px;letter-spacing:-.02em}
.pnr-form-head p{margin:5px 0 0;color:var(--mut);font-size:13px;line-height:1.5}
.pnr-form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.pnr-field{display:flex;flex-direction:column;gap:6px;min-width:0;color:#465267;font-size:12px;font-weight:650}
.pnr-field input,.pnr-field select,.pnr-field textarea{width:100%;min-height:42px;padding:10px 12px;border:1px solid #dce2eb;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.pnr-field input:focus,.pnr-field select:focus,.pnr-field textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px #674ee81c}
.pnr-field textarea{min-height:112px;resize:vertical;line-height:1.5}
.pnr-span-2{grid-column:span 2}.pnr-span-3{grid-column:span 3}.pnr-span-6{grid-column:1/-1}
.pnr-field input[type=file]{min-height:unset;padding:9px;background:#f8f9fc;font-size:13px}
.pnr-upload{padding:14px;border:1px dashed #cbd3e1;border-radius:12px;background:#fafbfe}
.pnr-upload small{color:var(--mut);font-size:12px;font-weight:400}
.pnr-form-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.pnr-form-footer .btn{min-height:42px;padding:11px 18px}
.pnr-list{display:grid;gap:12px}
.pnr-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2px}
.pnr-count{padding:5px 10px;border-radius:99px;background:#f1efff;color:#5541bd;font-size:12px;font-weight:750}
.pnr-empty{padding:26px 18px;border:1px dashed #d7deea;border-radius:14px;background:#fafbfe;text-align:center;color:var(--mut);font-size:14px}
.pnr-claim{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 8px #18223008}
.pnr-claim-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pnr-claim-title{font-size:15px;line-height:1.5}
.pnr-claim-meta{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:10px;color:var(--mut);font-size:12px}
.pnr-claim-meta b{color:var(--ink)}
.pnr-claim details{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pnr-claim summary{cursor:pointer;font-size:13px;font-weight:700;color:#354155}
.pnr-claim-detail{white-space:pre-wrap;margin:12px 0;padding:12px;border-radius:10px;background:#f8f9fc;font-size:13px;line-height:1.6}
.pnr-timeline{display:grid;gap:9px}
.pnr-event{padding:10px 12px;border-left:3px solid #d8d2fa;border-radius:0 9px 9px 0;background:#faf9ff;font-size:13px;line-height:1.5}
.pnr-event small{display:block;margin:2px 0 4px;color:var(--mut);font-size:11px}
.pnr-event-files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pnr-event-files a{padding:5px 9px;border-radius:8px;background:#eceefb;color:var(--pri);font-size:12px;font-weight:650;text-decoration:none}
.pnr-event-files a:hover{text-decoration:underline}
.pnr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:850px){header{padding:0 18px}.workspace{grid-template-columns:1fr;grid-template-rows:auto auto}.sidebar{position:static;padding:10px 12px;min-height:0;height:auto;overflow:visible}.nav-caption{display:none}.role-nav{display:block}.nav-group{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:8px}.role-nav button{font-size:12px;padding:9px 8px;justify-content:center}.nav-icon{width:auto}.content{padding:20px 16px 32px}}
@media(max-width:1100px){.pnr-form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pnr-span-2,.pnr-span-3{grid-column:span 1}}
@media(max-width:850px){.doc-import-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.exec-charts{grid-template-columns:1fr}}
@media(max-width:560px){header{height:auto;min-height:68px;padding:10px 14px;align-items:center;flex-basis:auto}header .brand{min-width:0;gap:8px}header .brandmark{width:100px;max-height:30px}header h1{font-size:13px}header .subtitle{display:none}header .role{display:none}header .head-actions{gap:6px}header button{padding:7px 9px}.sidebar{padding:9px}.nav-group{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:16px 12px 28px}.page-heading{margin-bottom:13px}.page-heading h2{font-size:19px}.content .bar{gap:8px;padding:10px}.bar label{font-size:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:11px}.kpi b{font-size:22px}.doc-import{padding:16px}.doc-import-head h3,.doc-section-title h3{font-size:16px}.doc-import-grid{grid-template-columns:1fr;gap:10px}.doc-import-footer{align-items:stretch;flex-direction:column}.doc-import-footer .btn{width:100%}.exec-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.exec-stat{padding:12px}.exec-stat b{font-size:20px}.exec-chart{padding:14px}.exec-bar-row{grid-template-columns:minmax(65px,80px) minmax(0,1fr) 36px;gap:7px}.pnr-layout{padding:4px 0}.pnr-panel{padding:16px}.pnr-form-head{margin-bottom:14px}.pnr-form-head h3{font-size:16px}.pnr-form-grid{grid-template-columns:1fr;gap:11px}.pnr-span-2,.pnr-span-3,.pnr-span-6{grid-column:1}.pnr-form-footer{align-items:stretch;flex-direction:column-reverse}.pnr-form-footer .btn{width:100%}.pnr-claim{padding:14px}.pnr-claim-top{flex-direction:column}.pnr-list-head h3{font-size:16px}}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">
  <div class="welcome">
    <img class="logo" src="chazki-logo.webp" alt="Logo de Chazki">
    <div class="country">MÉXICO</div>
    <h1>Bienvenido</h1>
    <span class="spinner" aria-hidden="true"></span>
  </div>
</div>
<div id="auth" class="hide">
  <div class="welcome-brand">
    <img class="welcome-logo" src="chazki-logo.webp" alt="Logo de Chazki">

    <div class="welcome-country">México</div>
  </div>
  <div style="color:#6b7090;font-size:13px">Acceso solo para personal de Chazki, con tu cuenta de Google Workspace (@chazki.com)</div>

    <label style="font-size:12px;color:#6b7090;display:block;margin-top:8px">Correo @chazki.com</label><input id="aemail" type="email" placeholder="nombre@chazki.com">

</div>
<div id="panel" class="hide">
<header><div class="brand"><img class="brandmark" src="chazki-logo.webp" alt="Chazki"><div><h1 class="welcome-title">Bienvenido</h1><span class="subtitle">México</span></div></div><div class="head-actions"><span id="who" class="role"></span><button id="bell" type="button" aria-label="Avisos">🔔<span id="bellc" class="hide">0</span></button><button id="out">Salir</button></div></header>
<div class="workspace">
<aside class="sidebar" aria-label="Navegación principal">
  <nav class="role-nav" aria-label="Secciones operativas">
