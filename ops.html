<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Chazki Driver · Panel de Operaciones</title>
<style>
:root{--bg:#f3f5f9;--ink:#182230;--mut:#718096;--line:#e5eaf1;--pri:#4b2fd0;--pri2:#674ee8;--ok:#12845b;--bad:#d9434b;--nav:#111827;--navmut:#a7b0c0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;height:72px;background:#fff;color:var(--ink);padding:0 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
header .brand{display:flex;align-items:center;gap:14px;min-width:300px}
header .brandmark{display:block;width:150px;height:auto;max-height:42px;object-fit:contain}
header h1{margin:0;font-size:16px;letter-spacing:-.02em}header .subtitle{display:block;color:var(--mut);font-size:11px;margin-top:3px}
header .welcome-title{margin:0}
header .head-actions{display:flex;align-items:center;gap:10px}
header .role{font-size:12px;color:#5541bd;background:#f1efff;padding:7px 11px;border-radius:99px;font-weight:700}
header button{color:#445064;background:#f3f5f9;border:1px solid var(--line);padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
header #bell{font-size:16px;padding:7px 11px;position:relative}
#bellc{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;text-align:center}
.workspace{display:grid;grid-template-columns:244px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:72px;align-self:start;background:var(--nav);padding:22px 13px;color:#fff;min-height:calc(100vh - 72px);height:calc(100vh - 72px);overflow-y:auto}
.nav-caption{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#7f8ba0;padding:16px 12px 7px}
.role-nav{display:flex;flex-direction:column;gap:4px;margin:0}
.nav-group{display:flex;flex-direction:column;gap:4px}
.role-nav button{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;color:var(--navmut);padding:10px 12px;border-radius:9px;font-size:13px;font-weight:550;cursor:pointer;transition:background .15s,color .15s}
.role-nav button:hover{background:#ffffff10;color:#fff}
.role-nav button.on{background:#4b2fd033;color:#fff;box-shadow:inset 3px 0 var(--pri2)}
.nav-icon{width:20px;text-align:center;font-size:15px;opacity:.9}
.content{min-width:0;padding:25px 28px 40px}
.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.page-heading h2{margin:0;font-size:22px;letter-spacing:-.03em}.page-heading p{margin:5px 0 0;color:var(--mut);font-size:13px}
.content .bar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 2px 6px #18223008}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,23,43,.06)}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:26px;margin-top:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:0 2px 8px #18223008;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
tr:last-child td{border:0}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.ok{background:#dcf5ea;color:#0b7a50}.w{background:#fdf0d4;color:#946200}.bad{background:#fde3e4;color:#b3262b}
img.th{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer}
#auth{width:calc(100% - 32px);max-width:420px;margin:12vh auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(20,23,43,.1)}
#auth .welcome-brand{text-align:center;margin-bottom:20px}
#auth .welcome-logo{display:block;width:min(270px,100%);height:auto;margin:0 auto 15px;object-fit:contain}
#auth .welcome-heading{margin:0 0 5px;font-size:25px;letter-spacing:-.03em}
#auth .welcome-country{color:var(--mut);font-size:13px;font-weight:600}
#auth input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;font-size:15px}
#auth button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.errbox{background:#fde3e4;color:#8f1d22;border-radius:10px;padding:9px;font-size:13px;margin-top:10px}
.hide{display:none!important}
#loading{position:fixed;inset:0;background:linear-gradient(145deg,#3923ad,#674ee8);z-index:60;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
#loading .welcome{display:flex;flex-direction:column;align-items:center;gap:12px}
#loading .logo{display:block;width:min(300px,82vw);height:auto;max-height:76px;object-fit:contain}
#loading .country{font-size:13px;font-weight:600;letter-spacing:.08em;color:#ffffffd9}
#loading h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 0}
#loading p{margin:0;color:#ffffffc9;font-size:14px}
#loading .spinner{width:24px;height:24px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:loading-spin .8s linear infinite;margin-top:8px}
@keyframes loading-spin{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:rgba(20,23,43,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#modal .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:660px}
#modal label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#modal input[type=number],#modal input[type=text],#modal select,#modal textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:#eceefb;color:var(--pri)}.btn:disabled{background:#c9cbdb;cursor:not-allowed}.sm{padding:6px 10px;font-size:12px;border-radius:8px}
td select{padding:6px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.res{width:100%}.res td{padding:5px 8px}.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}.res tr.t td{font-weight:700;border-top:2px solid var(--line)}.res tr.h td{color:var(--mut);font-size:11px;text-transform:uppercase;border:0;padding-top:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14172b;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;z-index:40;opacity:0;transition:.25s;pointer-events:none;max-width:90%}#toast.show{opacity:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9}#lb img{max-width:92vw;max-height:92vh;border-radius:10px}
@media(max-width:850px){header{padding:0 18px}.workspace{grid-template-columns:1fr;grid-template-rows:auto auto}.sidebar{position:static;padding:10px 12px;min-height:0;height:auto;overflow:visible}.nav-caption{display:none}.role-nav{display:block}.nav-group{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:8px}.role-nav button{font-size:12px;padding:9px 8px;justify-content:center}.nav-icon{width:auto}.content{padding:20px 16px 32px}}
@media(max-width:560px){header{height:auto;min-height:68px;padding:10px 14px;align-items:center;flex-basis:auto}header .brand{min-width:0;gap:8px}header .brandmark{width:100px;max-height:30px}header h1{font-size:13px}header .subtitle{display:none}header .role{display:none}header .head-actions{gap:6px}header button{padding:7px 9px}.sidebar{padding:9px}.nav-group{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:16px 12px 28px}.page-heading{margin-bottom:13px}.page-heading h2{font-size:19px}.content .bar{gap:8px;padding:10px}.bar label{font-size:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:11px}.kpi b{font-size:22px}}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">
  <div class="welcome">
    <img class="logo" src="chazki-logo.webp" alt="Logo de Chazki">
    <div class="country">MÉXICO</div>
    <h1>Bienvenido</h1>
    <span class="spinner" aria-hidden="true"></span>
  </div>
</div>
<div id="auth" class="hide">
  <div class="welcome-brand">
    <img class="welcome-logo" src="chazki-logo.webp" alt="Logo de Chazki">
    <h1 class="welcome-heading">Bienvenido</h1>
    <div class="welcome-country">México</div>
  </div>
  <div style="color:#6b7090;font-size:13px">Acceso solo para personal de Chazki, con tu cuenta de Google Workspace (@chazki.com)</div>
  <button id="agoogle" style="margin-top:16px;background:#fff;color:#1a1d23;border:1px solid #d0d5dd">Entrar con Google</button>
  <div style="text-align:center;margin-top:12px"><a href="#" id="apw-toggle" style="font-size:12px;color:#6b7090">Usar correo y contraseña</a></div>
  <div id="apw" class="hide">
    <label style="font-size:12px;color:#6b7090;display:block;margin-top:8px">Correo @chazki.com</label><input id="aemail" type="email" placeholder="nombre@chazki.com">
    <label style="font-size:12px;color:#6b7090">Contraseña</label><input id="apass" type="password">
    <button id="abtn">Entrar</button>
  </div>
  <div id="amsg"></div>
</div>
<div id="panel" class="hide">
<header><div class="brand"><img class="brandmark" src="chazki-logo.webp" alt="Chazki"><div><h1 class="welcome-title">Bienvenido</h1><span class="subtitle">México</span></div></div><div class="head-actions"><span id="who" class="role"></span><button id="bell" type="button" aria-label="Avisos">🔔<span id="bellc" class="hide">0</span></button><button id="out">Salir</button></div></header>
<div class="workspace">
<aside class="sidebar" aria-label="Navegación principal">
  <nav class="role-nav" aria-label="Secciones operativas">
    <div class="nav-caption">Operación diaria</div>
    <div class="nav-group" data-nav-group="operacion">
      <button class="on" data-t="r">Rutas</button><button data-t="v">Por validar</button><button data-t="a">Por aprobar</button><button data-t="l">Validadas</button><button data-t="c">Cancelaciones</button><button data-t="i">Incidencias</button><button data-t="f">Fallidos por causa</button>
    </div>
    <div class="nav-caption">Gestión y control</div>
    <div class="nav-group" data-nav-group="administracion">
      <button data-t="b">Bajas</button><button data-t="k">Cambios de datos</button><button data-t="t">Tarifario</button><button data-t="d">Descargas</button><button data-t="n">Padrón</button><button data-t="p">Proveedores y drivers</button>
    </div>
  </nav>
</aside>
<main class="content">
  <div class="page-heading"><div><h2 id="page-title">Rutas</h2><p id="page-description">Consulta y seguimiento de la operación diaria.</p></div></div>
  <div class="bar"><label>Desde <input type="date" id="d1"></label><label>Hasta <input type="date" id="d2"></label>
    <select id="fcli"><option value="">Todos los clientes</option></select><button id="go" style="padding:9px 16px;border:0;border-radius:10px;background:#4b2fd0;color:#fff;cursor:pointer">Actualizar</button></div>
  <div class="kpis" id="kpis"></div>
  <div class="card" id="view"></div>
</main></div></div>
<div id="lb" class="hide"><img id="lbimg"></div>
<div id="modal" class="hide"></div><div id="toast"></div>

<script src="vendor/supabase-js-2.118.0.js"></script>
<script src="config.js"></script>
<script src="ops.js"></script>
</body>
</html>
