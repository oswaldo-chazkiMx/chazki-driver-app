<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Chazki Driver · Panel de Operaciones</title>
<style>
:root{--bg:#f3f4f8;--ink:#14172b;--mut:#6b7090;--line:#e4e6f0;--pri:#4b2fd0;--ok:#12a36b;--bad:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,#4b2fd0,#6b4df5);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:18px}header a,header button{color:#fff;background:rgba(255,255,255,.2);border:0;padding:7px 13px;border-radius:99px;font-size:13px;text-decoration:none;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,23,43,.06)}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:26px;margin-top:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{border:0;background:#eceefb;color:var(--pri);padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff}
.card{background:#fff;border-radius:14px;padding:6px 14px;box-shadow:0 1px 3px rgba(20,23,43,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
tr:last-child td{border:0}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.ok{background:#dcf5ea;color:#0b7a50}.w{background:#fdf0d4;color:#946200}.bad{background:#fde3e4;color:#b3262b}
img.th{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer}
#auth{max-width:340px;margin:12vh auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
#auth input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;font-size:15px}
#auth button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.errbox{background:#fde3e4;color:#8f1d22;border-radius:10px;padding:9px;font-size:13px;margin-top:10px}
.hide{display:none!important}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9}#lb img{max-width:92vw;max-height:92vh;border-radius:10px}
</style>
</head>
<body>
<div id="auth" class="hide">
  <h2 style="margin:0 0 4px">Panel de Operaciones</h2><div style="color:#6b7090;font-size:13px">Chazki Driver</div>
  <label style="font-size:12px;color:#6b7090;display:block;margin-top:12px">Correo</label><input id="aemail" type="email">
  <label style="font-size:12px;color:#6b7090">Contraseña</label><input id="apass" type="password">
  <button id="abtn">Entrar</button><div id="amsg"></div>
</div>
<div id="panel" class="hide">
<header><h1>Chazki Driver · Operaciones</h1><div><span id="who" style="font-size:13px;margin-right:10px"></span><a href="index.html">App driver</a> <button id="out">Salir</button></div></header>
<main>
  <div class="bar"><label>Desde <input type="date" id="d1"></label><label>Hasta <input type="date" id="d2"></label>
    <select id="fcli"><option value="">Todos los clientes</option></select><button id="go" style="padding:9px 16px;border:0;border-radius:10px;background:#4b2fd0;color:#fff;cursor:pointer">Actualizar</button></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs"><button class="on" data-t="r">Rutas</button><button data-t="c">Cancelaciones</button><button data-t="i">Incidencias</button><button data-t="f">Fallidos por causa</button></div>
  <div class="card" id="view"></div>
</main></div>
<div id="lb" class="hide"><img id="lbimg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);const $=id=>document.getElementById(id);
let R=[],C=[],tab="r",photos={};
const fd=m=>m==null?"—":(m<1000?m+" m":(m/1000).toFixed(1)+" km");
const hh=s=>s?new Date(s).toTimeString().slice(0,5):"—";
const dd=s=>new Date(s).toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
$("abtn").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("aemail").value.trim(),password:$("apass").value});
  if(r.error){$("amsg").innerHTML='<div class="errbox">Correo o contraseña incorrectos.</div>';return}boot()};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("lb").onclick=()=>$("lb").classList.add("hide");
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));tab=b.dataset.t;render()});
$("go").onclick=load;
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("auth").classList.remove("hide");return}
  const {data:me}=await sb.from("drivers").select("nombre,rol").eq("id",session.user.id).single();
  if(!me||me.rol!=="ops"){$("auth").classList.remove("hide");$("amsg").innerHTML='<div class="errbox">Esta cuenta no tiene acceso al panel de Operaciones.</div>';await sb.auth.signOut();return}
  $("auth").classList.add("hide");$("panel").classList.remove("hide");$("who").textContent=me.nombre;
  const hoy=new Date().toLocaleDateString("en-CA");$("d1").value=hoy;$("d2").value=hoy;
  const {data:cl}=await sb.from("clientes").select("id,nombre").order("nombre");
  $("fcli").innerHTML='<option value="">Todos los clientes</option>'+(cl||[]).map(c=>`<option value="${c.id}">${c.nombre}</option>`).join("");
  load();
}
async function load(){
  const a=new Date($("d1").value+"T00:00:00").toISOString(),b=new Date($("d2").value+"T23:59:59").toISOString();
  const [r,c]=await Promise.all([
    sb.from("rutas").select("*,drivers(nombre,codigo),cedis(nombre,cliente_id,clientes(nombre)),ruta_fallos(cantidad,causas_fallo(nombre)),ruta_incidencias(comentario,tipos_incidencia(nombre))").gte("checkin_at",a).lte("checkin_at",b).order("checkin_at",{ascending:false}),
    sb.from("cancelaciones").select("*,drivers(nombre,codigo),cedis(nombre,cliente_id,clientes(nombre))").gte("capturado_at",a).lte("capturado_at",b).order("capturado_at",{ascending:false})]);
  const f=$("fcli").value;const keep=x=>!f||String(x.cedis.cliente_id)===f;
  R=(r.data||[]).filter(keep);C=(c.data||[]).filter(keep);
  const paths=C.map(x=>x.foto_path);photos={};
  if(paths.length){const s=await sb.storage.from("cancelaciones").createSignedUrls(paths,3600);(s.data||[]).forEach(x=>{photos[x.path]=x.signedUrl})}
  render();
}
function render(){
  const cer=R.filter(x=>x.estado==="cerrada"),asg=R.reduce((s,x)=>s+x.paquetes_asignados,0),ent=cer.reduce((s,x)=>s+x.entregados,0),fal=cer.reduce((s,x)=>s+x.fallidos,0);
  const incs=R.reduce((s,x)=>s+x.ruta_incidencias.length,0);
  $("kpis").innerHTML=[["Rutas",R.length],["En ruta",R.filter(x=>x.estado==="en_ruta").length],["Paquetes asignados",asg],["Entregados",ent],["Fallidos",fal],["Efectividad",(ent+fal)?Math.round(ent/(ent+fal)*100)+"%":"—"],["Cancelaciones",C.length],["Canc. fuera del CEDIS",C.filter(x=>x.ubicacion_validada==="fuera").length],["Incidencias",incs]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join("");
  let h="";
  if(tab==="r")h=`<table><tr><th>Fecha</th><th>Driver</th><th>Cliente · CEDIS</th><th>Ruta</th><th>Zonas</th><th>Llegada</th><th>Asig.</th><th>Entreg.</th><th>Fall.</th><th>Estado</th></tr>`+
    (R.map(x=>`<tr><td>${dd(x.checkin_at)}</td><td>${x.drivers.nombre}<br><small>${x.drivers.codigo||""}</small></td><td><b>${x.cedis.clientes.nombre}</b><br>${x.cedis.nombre}</td><td>${x.id_ruta}</td><td>${x.zonas.join(", ")}</td><td>${hh(x.hora_llegada_cedis)}</td><td>${x.paquetes_asignados}</td><td>${x.entregados??"—"}</td><td>${x.fallidos??"—"}</td><td><span class="pill ${x.estado==="cerrada"?"ok":"w"}">${x.estado==="cerrada"?"Cerrada "+hh(x.checkout_at):"En ruta"}</span></td></tr>`).join("")||`<tr><td colspan="10">Sin rutas en este periodo.</td></tr>`)+`</table>`;
  if(tab==="c")h=`<table><tr><th>Fecha y hora</th><th>Driver</th><th>Cliente · CEDIS</th><th>Ruta</th><th>Pin</th><th>Validación de ubicación</th><th>Evidencia</th></tr>`+
    (C.map(x=>`<tr><td>${dd(x.capturado_at)} ${hh(x.capturado_at)}</td><td>${x.drivers.nombre}</td><td><b>${x.cedis.clientes.nombre}</b><br>${x.cedis.nombre}</td><td>${x.id_ruta||"—"}</td><td><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${x.lat},${x.lng}">${x.lat.toFixed(4)}, ${x.lng.toFixed(4)}</a></td><td>${x.ubicacion_validada==="dentro"?`<span class="pill ok">Dentro · ${fd(x.distancia_cedis_m)}</span>`:x.ubicacion_validada==="fuera"?`<span class="pill bad">Fuera · ${fd(x.distancia_cedis_m)}</span>`:'<span class="pill w">Sin coordenadas</span>'}</td><td>${photos[x.foto_path]?`<img class="th" src="${photos[x.foto_path]}" data-u="${photos[x.foto_path]}">`:"—"}</td></tr>`).join("")||`<tr><td colspan="7">Sin cancelaciones en este periodo.</td></tr>`)+`</table>`;
  if(tab==="i"){const rows=R.flatMap(x=>x.ruta_incidencias.map(i=>({x,i})));h=`<table><tr><th>Fecha</th><th>Driver</th><th>Cliente · CEDIS</th><th>Incidencia</th><th>Comentario</th></tr>`+
    (rows.map(({x,i})=>`<tr><td>${dd(x.checkin_at)}</td><td>${x.drivers.nombre}</td><td>${x.cedis.clientes.nombre} · ${x.cedis.nombre}</td><td><span class="pill bad">${i.tipos_incidencia.nombre}</span></td><td>${i.comentario||"—"}</td></tr>`).join("")||`<tr><td colspan="5">Sin incidencias en este periodo.</td></tr>`)+`</table>`}
  if(tab==="f"){const m={};R.forEach(x=>x.ruta_fallos.forEach(f=>{m[f.causas_fallo.nombre]=(m[f.causas_fallo.nombre]||0)+f.cantidad}));const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);
    h=`<table><tr><th>Causa</th><th>Paquetes</th></tr>`+(e.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")||`<tr><td colspan="2">Sin fallidos en este periodo.</td></tr>`)+`</table>`}
  $("view").innerHTML=h;
  document.querySelectorAll("img.th").forEach(i=>i.onclick=()=>{$("lbimg").src=i.dataset.u;$("lb").classList.remove("hide")});
}
boot();
</script>
</body>
</html>
